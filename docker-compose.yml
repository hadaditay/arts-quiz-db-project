x-backend-env: &backend-env
  NODE_ENV: development
  PORT: 4000
  CORS_ORIGIN: http://localhost:5173
  SESSION_SECRET: change-me
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: curator
  MYSQL_PASSWORD: curator
  MYSQL_DATABASE: curators_eye
  MET_CSV_PATH: /app/data/met/MetObjects_update.csv

x-backend-build: &backend-build
  context: .
  dockerfile: apps/backend/Dockerfile

services:
  mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: curators_eye
      MYSQL_USER: curator
      MYSQL_PASSWORD: curator
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pdevroot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: *backend-build
    image: curators-eye-backend
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data:ro

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
    image: curators-eye-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
